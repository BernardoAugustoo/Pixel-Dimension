<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pixel Dimension</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="fundo-animado">
        <div class="mapa mapa-1"></div>
        <div class="mapa mapa-2"></div>
        <div class="mapa mapa-3"></div>
        <div class="mapa mapa-4"></div>
    </div>

    <div class="sobreposicao"></div>

    <main class="container-login">

        <header class="cabecalho-login">
            <h1>Pixel Dimension</h1>
            <p></p>
        </header>

        <form id="form-login">

            <div class="campo">
                <label for="nome">Nome do jogador</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" autocomplete="username" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite uma senha" autocomplete="off">
            </div>

            <button type="submit" id="botao-jogar">
                JOGAR
            </button>

            <button type="button" id="botao-referencias">
                REFERÊNCIAS
            </button>

        </form>

        <footer class="rodape-login">
            <p></p>
        </footer>

    </main>

    <script src="Js/login.js"></script>

</body>

</html>
